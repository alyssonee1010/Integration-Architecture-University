openapi: 3.0.3
info:
  title: Salesmen & Social Performance API (In-Memory)
  version: 1.0.0
  description: >
    REST API over an in-memory dataset of salesmen and their social performance
    records. No database; IDs are strings generated by crypto. Replacing all
    performance records is supported via PUT (delete & recreate).

servers:
  - url: http://localhost:3000

paths:
  /api/salesmen:
    get:
      summary: List all salesmen
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Salesman" }
    post:
      summary: Create a salesman
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesmanCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Salesman" }
        "400":
          description: Missing required fields

  /api/salesmen/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: Get a salesman by id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Salesman" }
        "404": { description: Not found }
    put:
      summary: Update a salesman and optionally replace performance records
      description: >
        Patches firstname/lastname. If `performanceRecords` is provided, the full
        set is validated and **replaces** the existing records (delete & recreate).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesmanUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Salesman" }
        "400": { description: Validation error }
        "404": { description: Not found }
    delete:
      summary: Delete a salesman
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  /api/salesmen/{id}/performance-records:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: List performance records for a salesman
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PerformanceRecord" }
        "404": { description: Salesman not found }
    post:
      summary: Add a single performance record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PerformanceRecord" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PerformanceRecord" }
        "400": { description: Validation error or duplicate year }
        "404": { description: Salesman not found }
    put:
      summary: Replace all performance records (delete & recreate)
      description: >
        Validates the array, deletes existing records, and recreates the provided ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/PerformanceRecord" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PerformanceRecord" }
        "400": { description: Validation error }
        "404": { description: Salesman not found }
    delete:
      summary: Delete all performance records for a salesman
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: Number of records removed
                    example: 3
        "404": { description: Salesman not found }

components:
  schemas:
    Salesman:
      type: object
      properties:
        _id: { type: string, example: "68efd009111f8005f688d5fb" }
        firstname: { type: string, example: "Anna" }
        lastname:  { type: string, example: "Schmidt" }
        performanceRecords:
          type: array
          items: { $ref: "#/components/schemas/PerformanceRecord" }
      required: [ _id, firstname, lastname, performanceRecords ]

    SalesmanCreate:
      type: object
      properties:
        firstname: { type: string }
        lastname:  { type: string }
      required: [ firstname, lastname ]

    SalesmanUpdate:
      type: object
      description: >
        Provide fields to update. If performanceRecords is supplied, it replaces
        the entire set.
      properties:
        firstname: { type: string }
        lastname:  { type: string }
        performanceRecords:
          type: array
          items: { $ref: "#/components/schemas/PerformanceRecord" }

    PerformanceRecord:
      type: object
      properties:
        year: { type: integer, example: 2025 }
        leadership_competence: { type: integer, minimum: 1, maximum: 5 }
        openness_employees:    { type: integer, minimum: 1, maximum: 5 }
        attitude_clients:      { type: integer, minimum: 1, maximum: 5 }
        communication:         { type: integer, minimum: 1, maximum: 5 }
        integrity_company:     { type: integer, minimum: 1, maximum: 5 }
      required:
        [ year, leadership_competence, openness_employees, attitude_clients, communication, integrity_company ]
